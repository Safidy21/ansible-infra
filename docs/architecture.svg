<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d399"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#60a5fa"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- fond -->
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="24" fill="url(#grid)"/>

  <!-- titre -->
  <text x="48" y="58" font-size="26" font-weight="700" fill="#f1f5f9">ansible-infra</text>
  <text x="228" y="58" font-size="18" fill="#94a3b8">· architecture du lab</text>
  <g transform="translate(940,34)">
    <rect width="212" height="32" rx="16" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
    <circle cx="20" cy="16" r="5" fill="#34d399"/>
    <text x="34" y="21" font-size="14" fill="#a7f3d0">rôle docker · v1.0.0</text>
  </g>

  <!-- ===== ZONE GITHUB ===== -->
  <rect x="40" y="92" width="1120" height="248" rx="18" fill="#a78bfa" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.45" stroke-dasharray="6 6"/>
  <text x="64" y="124" font-size="15" font-weight="700" fill="#c4b5fd" letter-spacing="1.5">GITHUB</text>
  <text x="138" y="124" font-size="14" fill="#94a3b8">dépôt Safidy21/ansible-infra</text>

  <!-- Pull request -->
  <g filter="url(#sh)">
    <rect x="72" y="166" width="170" height="118" rx="14" fill="#1e1b3a" stroke="#a78bfa" stroke-opacity="0.7"/>
  </g>
  <g transform="translate(96,186)" stroke="#c4b5fd" stroke-width="2.4" fill="none" stroke-linecap="round">
    <circle cx="6" cy="6" r="5"/><circle cx="6" cy="34" r="5"/><circle cx="34" cy="34" r="5"/>
    <path d="M6 11V29"/><path d="M34 29V18a6 6 0 0 0-6-6H18"/><path d="M22 7l-5 5 5 5"/>
  </g>
  <text x="96" y="252" font-size="17" font-weight="700" fill="#f1f5f9">Pull Request</text>
  <text x="96" y="272" font-size="13" fill="#a5b4fc">branche → main</text>

  <!-- pipeline CI -->
  <rect x="282" y="152" width="612" height="160" rx="16" fill="#0e2a33" fill-opacity="0.85" stroke="#22d3ee" stroke-opacity="0.55"/>
  <text x="306" y="182" font-size="14" font-weight="700" fill="#67e8f9" letter-spacing="1">GITHUB ACTIONS · CI</text>
  <text x="510" y="182" font-size="13" fill="#94a3b8">job « Lint et syntaxe Ansible »</text>

  <g font-size="16" font-weight="700" fill="#f1f5f9">
    <rect x="306" y="204" width="168" height="84" rx="12" fill="#12343f" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="324" y="238">yamllint</text>
    <text x="324" y="262" font-size="13" font-weight="400" fill="#a5f3fc">la forme du YAML</text>

    <rect x="504" y="204" width="168" height="84" rx="12" fill="#12343f" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="522" y="238">syntax-check</text>
    <text x="522" y="262" font-size="13" font-weight="400" fill="#a5f3fc">la structure</text>

    <rect x="702" y="204" width="168" height="84" rx="12" fill="#12343f" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="720" y="238">ansible-lint</text>
    <text x="720" y="262" font-size="13" font-weight="400" fill="#a5f3fc">profil production</text>
  </g>
  <path d="M476 246H500" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M674 246H698" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M244 225H302" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#arr)"/>

  <!-- main protégée -->
  <g filter="url(#sh)">
    <rect x="934" y="166" width="200" height="118" rx="14" fill="#0f2e25" stroke="#34d399" stroke-opacity="0.75"/>
  </g>
  <g transform="translate(958,186)">
    <path d="M18 2l15 6v10c0 10-7 17-15 20C10 35 3 28 3 18V8z" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M11 19l5 5 9-10" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="958" y="252" font-size="17" font-weight="700" fill="#f1f5f9">main protégée</text>
  <text x="958" y="272" font-size="13" fill="#a7f3d0">fusion si CI verte</text>
  <path d="M896 225H930" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrG)"/>

  <!-- secret -->
  <g transform="translate(306,318)">
    <rect width="300" height="0" fill="none"/>
  </g>
  <g transform="translate(600,322)">
    <rect x="-150" y="-14" width="300" height="28" rx="14" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.55"/>
    <g transform="translate(-136,-7)" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="5" cy="7" r="4.5"/><path d="M9.5 7H20M16 7v4M19 7v3"/>
    </g>
    <text x="-108" y="5" font-size="13" fill="#fde68a">secret ANSIBLE_VAULT_PASSWORD</text>
  </g>

  <!-- ===== ZONE VMWARE ===== -->
  <rect x="40" y="384" width="1120" height="336" rx="18" fill="#60a5fa" fill-opacity="0.05" stroke="#60a5fa" stroke-opacity="0.45" stroke-dasharray="6 6"/>
  <text x="64" y="416" font-size="15" font-weight="700" fill="#93c5fd" letter-spacing="1.5">VMWARE WORKSTATION</text>
  <text x="1136" y="416" font-size="14" fill="#94a3b8" text-anchor="end">réseau NAT · aucune IP dans le dépôt</text>

  <!-- git push -->
  <path d="M300 456V342" stroke="#a78bfa" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arr)"/>
  <rect x="314" y="372" width="96" height="26" rx="13" fill="#1e1b3a" stroke="#a78bfa" stroke-opacity="0.6"/>
  <text x="330" y="390" font-size="13" fill="#c4b5fd">git push</text>

  <!-- lab-srv -->
  <g filter="url(#sh)">
    <rect x="72" y="440" width="456" height="250" rx="16" fill="#132036" stroke="#60a5fa" stroke-opacity="0.7"/>
  </g>
  <g transform="translate(96,462)" stroke="#93c5fd" stroke-width="2.2" fill="none">
    <rect x="0" y="0" width="38" height="14" rx="3"/><rect x="0" y="20" width="38" height="14" rx="3"/>
    <circle cx="8" cy="7" r="1.6" fill="#93c5fd"/><circle cx="8" cy="27" r="1.6" fill="#93c5fd"/>
  </g>
  <text x="150" y="476" font-size="20" font-weight="700" fill="#f1f5f9">lab-srv</text>
  <text x="150" y="496" font-size="14" fill="#93c5fd">Debian 13 (trixie) · control node</text>

  <g font-size="14" fill="#e2e8f0">
    <rect x="96" y="516" width="196" height="34" rx="9" fill="#1b2b47"/>
    <text x="110" y="538">ansible-core</text>
    <rect x="304" y="516" width="200" height="34" rx="9" fill="#1b2b47"/>
    <text x="318" y="538">rôle docker</text>
    <rect x="96" y="560" width="196" height="34" rx="9" fill="#1b2b47"/>
    <text x="110" y="582">inventaire + Vault</text>
    <rect x="304" y="560" width="200" height="34" rx="9" fill="#1b2b47"/>
    <text x="318" y="582">~/.ssh/config</text>
  </g>
  <rect x="96" y="610" width="408" height="56" rx="10" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.45"/>
  <text x="114" y="634" font-size="15" font-weight="700" fill="#a5f3fc">Docker Engine + Compose</text>
  <text x="114" y="654" font-size="13" fill="#94a3b8">cible locale · ansible_connection=local</text>

  <!-- SSH -->
  <path d="M530 565H668" stroke="#60a5fa" stroke-width="2.6" marker-end="url(#arrB)"/>
  <rect x="546" y="510" width="106" height="44" rx="10" fill="#0b1220" stroke="#60a5fa" stroke-opacity="0.6"/>
  <g transform="translate(560,523)" stroke="#93c5fd" stroke-width="2" fill="none" stroke-linecap="round">
    <rect x="0" y="7" width="14" height="11" rx="2"/><path d="M3 7V4a4 4 0 0 1 8 0v3"/>
  </g>
  <text x="582" y="530" font-size="14" font-weight="700" fill="#f1f5f9">SSH</text>
  <text x="582" y="546" font-size="11" fill="#93c5fd">clé dédiée</text>
  <text x="546" y="590" font-size="12" fill="#94a3b8">sans mot de passe</text>

  <!-- lab-node01 -->
  <g filter="url(#sh)">
    <rect x="672" y="440" width="456" height="250" rx="16" fill="#132036" stroke="#60a5fa" stroke-opacity="0.7"/>
  </g>
  <g transform="translate(696,462)" stroke="#93c5fd" stroke-width="2.2" fill="none">
    <rect x="0" y="0" width="38" height="14" rx="3"/><rect x="0" y="20" width="38" height="14" rx="3"/>
    <circle cx="8" cy="7" r="1.6" fill="#93c5fd"/><circle cx="8" cy="27" r="1.6" fill="#93c5fd"/>
  </g>
  <text x="750" y="476" font-size="20" font-weight="700" fill="#f1f5f9">lab-node01</text>
  <text x="750" y="496" font-size="14" fill="#93c5fd">Ubuntu 24.04 (noble) · cible distante</text>

  <g font-size="14" fill="#e2e8f0">
    <rect x="696" y="516" width="408" height="34" rx="9" fill="#1b2b47"/>
    <text x="710" y="538">même rôle, aucune ligne modifiée</text>
    <rect x="696" y="560" width="408" height="34" rx="9" fill="#1b2b47"/>
    <text x="710" y="582">dépôt généré par les faits : ubuntu · noble · amd64</text>
  </g>
  <rect x="696" y="610" width="408" height="56" rx="10" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.45"/>
  <text x="714" y="634" font-size="15" font-weight="700" fill="#a5f3fc">Docker Engine + Compose</text>
  <text x="714" y="654" font-size="13" fill="#94a3b8">idempotent : 2e exécution → changed=0</text>
</svg>
