---
- name: Supprimer les paquets en conflit avec Docker CE
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages }}"
    state: absent

- name: Installer les prérequis
  ansible.builtin.apt:
    name: "{{ docker_apt_prerequisites }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Créer le dossier des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Télécharger la clé GPG de Docker
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Déclarer le dépôt APT de Docker
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
  register: docker_repo

- name: Rafraîchir le cache APT si le dépôt vient d'être ajouté
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo is changed

- name: Installer les paquets Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
